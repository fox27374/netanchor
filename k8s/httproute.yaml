apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netanchor
spec:
  parentRefs:
    - name: netanchor
      sectionName: https
  hostnames:
    - netanchor.example.com
  rules:
    - backendRefs:
        - name: netanchor
          port: 80
---
# Plain-HTTP requests are redirected to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netanchor-redirect
spec:
  parentRefs:
    - name: netanchor
      sectionName: http
  hostnames:
    - netanchor.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
