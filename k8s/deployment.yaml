apiVersion: apps/v1
kind: Deployment
metadata:
  name: netanchor
spec:
  # File-backed, single-writer store: exactly one pod, and never two at once
  # during an update, so Recreate rather than RollingUpdate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netanchor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netanchor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netanchor
          image: ghcr.io/fox27374/netanchor:1.11.1
          ports:
            - name: http
              containerPort: 8443
          env:
            - name: NETANCHOR_ADDR
              value: "0.0.0.0:8443"
            - name: NETANCHOR_DATA
              value: /data
            # TLS is terminated at the Gateway; the app serves plain HTTP.
            - name: NETANCHOR_TLS
              value: "off"
            # Encrypted CAs unlock at startup from one passphrase file per CA ID (root for the root).
            # Without NETANCHOR_CA_SECRETS_DIR the files live in /data/ca-secrets, which is written
            # automatically when a CA is created with a passphrase. To use a Secret instead, mount it
            # and point NETANCHOR_CA_SECRETS_DIR at it. Automatic saves need a writable mount, so a
            # read-only Secret works only if you create each file yourself.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netanchor-data
        - name: tmp
          emptyDir: {}
